name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build Standalone Offline Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/release/*.apk release-output/ClassChamp.apk

      - name: Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassChamp-Release-APK
          path: release-output/ClassChamp.apk

      - name: Extract Version
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.pkg_version.outputs.version }}
          name: "ClassChamp ${{ steps.pkg_version.outputs.version }}"
          body: "Automated Standalone Offline Android Release of ClassChamp. Daily 10-Min CBSE Practice for Class 1 to 6."
          files: release-output/ClassChamp.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
